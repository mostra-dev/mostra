# cargo-deny (STANDARDS supply chain, EN-06): licenses, advisories, bans and sources for every
# crate. Mirrors the npm license audit: OSI-approved licenses only.
[graph]
all-features = true
# The platforms Mostra's crates build for (v1.0: macOS and glibc Linux on arm64 and x64, D35;
# Windows joined with WP-W1, D146, D150). Dependencies of other targets (wasm32's bundled root
# certificates under CDLA-Permissive-2.0, Android's JNI) never reach a host's build.
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
  # Windows (WP-W1, D150): mostra-win's windows-sys, and the host crate's Windows dependencies.
  "aarch64-pc-windows-msvc",
  "x86_64-pc-windows-msvc",
]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.93
unused-allowed-license = "allow"
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
