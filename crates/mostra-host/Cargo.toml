[package]
name = "mostra-host"
version = "0.6.0"
description = "Host Mostra, the agent artifact runtime, from Rust: the host protocol's wire types, a tokio client, spawn and attach, the runtime bundle and the host ports."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["mostra", "agent", "artifact", "json-rpc", "host"]
categories = ["api-bindings", "development-tools"]
readme = "README.md"
include = ["src/**/*.rs", "build.rs", "bundles.json", "README.md", "LICENSE", "NOTICE"]

[dependencies]
flate2 = "=1.1.10"
percent-encoding = "=2.3.2"
regress = "=0.12.0"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "stream"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "=0.7.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }
sha2 = "=0.11.1"
tar = "=0.4.46"
tokio = { version = "=1.53.3", features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
url = "=2.5.8"

# POSIX: signals and process liveness, the disk's free space.
[target.'cfg(unix)'.dependencies]
nix = { version = "=0.31.3", features = ["fs", "signal"] }

# Windows (WP-W3, D153): the control pipe's owner, process liveness and free space, in one module
# (`src/windows.rs`), the crate's only `unsafe`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
] }

[build-dependencies]
serde_json = "=1.0.154"

[dev-dependencies]
tempfile = "=3.27.0"
tokio = { version = "=1.53.3", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "test-util", "time"] }

# The workspace forbids `unsafe`; this crate's Windows module (`src/windows.rs`) calls Win32 for what
# the standard library can't, so it is denied here and allowed in that module alone.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
