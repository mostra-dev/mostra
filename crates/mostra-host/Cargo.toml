[package]
name = "mostra-host"
version = "0.0.0"
description = "Host Mostra, the agent artifact runtime, from Rust: the host protocol's wire types, a tokio client, spawn and attach, the runtime bundle and the host ports."
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["mostra", "agent", "artifact", "json-rpc", "host"]
categories = ["api-bindings", "development-tools"]
readme = "README.md"
include = ["src/**/*.rs", "build.rs", "bundles.json", "README.md", "LICENSE", "NOTICE"]

[dependencies]
flate2 = "1.1.4"
nix = { version = "0.31.3", features = ["fs", "signal"] }
regress = "0.12.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "stream"] }
rustls = { version = "0.23.32", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["raw_value"] }
sha2 = "0.11.1"
tar = "0.4.44"
tokio = { version = "1.47.1", features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }

[dev-dependencies]
tempfile = "3.23.0"
tokio = { version = "1.47.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
