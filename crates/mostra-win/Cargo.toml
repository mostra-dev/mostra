[package]
name = "mostra-win"
version = "0.0.0"
description = "Mostra's Windows platform helper: owner-only access control, the home's control pipe, every child in a Job Object behind a gate, and process identity by creation time (WP-W1)."
publish = false
# The programs' Windows manifest (build.rs).
include = ["src/**/*.rs", "build.rs", "windows.manifest"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# The helper the runtime runs (shipped in the Windows runtime bundles from WP-W3).
[[bin]]
name = "mostra-win"
path = "src/main.rs"

# The login service's launcher (D151): a program with no console, which Task Scheduler runs at
# logon to keep the home's daemon running without a window. Shipped beside `mostra-win`.
[[bin]]
name = "mostra-win-service"
path = "src/bin/service.rs"

# The runtime bundle's launcher (WP-W3, D153): copied into a Windows bundle's `bin\` as
# `mostra.exe`, `mostra-runtime.exe` and `mostra-setup.exe`.
[[bin]]
name = "mostra-launch"
path = "src/bin/launch.rs"

# Test probes only: opening a path or the control pipe as another user (RT-10's access check).
# Never shipped.
[[bin]]
name = "mostra-win-probe"
path = "src/bin/probe.rs"

[dependencies]
serde_json = "=1.0.154"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Environment",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

# The workspace forbids `unsafe`; this crate is the one place that calls Win32 directly. Its
# `unsafe` lives only in `src/win/sys.rs`, which allows it with a SAFETY note per call.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
