# Git hooks (REPO_STANDARDS §5). Installed by `pnpm install` (the root `prepare` script).
pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{js,mjs,cjs,ts,tsx,json,jsonc,css}"
      run: node_modules/.bin/biome check --write --no-errors-on-unmatched --files-ignore-unknown=true --colors=off {staged_files}
      stage_fixed: true
    # The React hooks rules (REPO_STANDARDS §4): Biome doesn't check them, and the pre-push check
    # leaves the format-lint job to CI.
    - name: eslint
      glob: "*.{ts,tsx}"
      run: tools/ts6/node_modules/.bin/eslint --config tools/ts6/eslint.config.mjs --max-warnings 0 --no-warn-ignored {staged_files}
    - name: cargo fmt
      glob: "*.rs"
      run: cargo fmt --all
      stage_fixed: true

commit-msg:
  jobs:
    - name: conventional commit with DCO sign-off
      run: node tools/commits/cli.ts msg {1}

pre-push:
  jobs:
    - name: pnpm check --fast
      run: node tools/check/cli.ts --fast
