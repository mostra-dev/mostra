packages:
  # Workspace layout and dependency policy (REPO_STANDARDS §4, §10).
  # Every dependency version lives in a catalog below; package.json files use `catalog:` or
  # `workspace:*` only, which `pnpm check` enforces (tools/repo-lint). The file starts with a key:
  # Renovate's security updates dropped a comment that opened it (D152).
  - packages/*
  - plugins/*
  - apps/*
  - templates/*
  - examples/*
  - tools
  - tools/ts6
  - tests/*

# Supply chain: install nothing published less than 7 days ago (Renovate uses the same cooldown),
# fail instead of falling back, refuse trust downgrades, and run no install scripts unless allowed.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - '@mostra/*'
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 262800
blockExoticSubdeps: true
strictDepBuilds: true
allowBuilds:
  lefthook: true

# dependency-cruiser loads TypeScript's compiler API but doesn't declare it, so pnpm would hand it
# the hoisted TypeScript 7, which has no such API. Declaring the peer makes it resolve tools/ts6's.
packageExtensions:
  dependency-cruiser:
    peerDependencies:
      typescript: '>=5 <7'

engineStrict: true
savePrefix: ''
catalogMode: strict
linkWorkspacePackages: true
saveWorkspaceProtocol: rolling

catalog:
  # Runtime dependencies of published packages
  zod: 4.6.7
  better-sqlite3: 13.0.3
  oxc-parser: 0.155.0
  ignore: 7.0.13
  semver: 7.8.5
  '@types/semver': 7.8.0
  # The SDK's bundle manager (WP-11): tar extraction, and fetch through the environment's proxy
  tar: 7.5.22
  undici: 8.12.3
  # The gateway (WP-05, D18): Hono on Node's HTTP server
  hono: 4.13.13
  '@hono/node-server': 2.1.5

  # The installer the deps module's install child runs (D94): pnpm 10, whose published package
  # contains no code from pnpm's PolyForm-licensed pnpr/ directory. Never 11 or later.
  pnpm: 10.34.7

  # The builder child (WP-03): Vite 8 with React, MDX 3 and Tailwind 4 (VERIFIED_FACTS, WP-03)
  vite: 8.3.4
  '@vitejs/plugin-react': 6.1.2
  '@mdx-js/mdx': 3.1.1
  remark-frontmatter: 5.0.0
  remark-gfm: 4.0.1
  '@tailwindcss/vite': 4.3.3

  # The warm set artifacts resolve (@mostra/warm, D91; ROUND-3 §1.2, D72; VERIFIED_FACTS, WP-04)
  react: 19.3.1
  react-dom: 19.3.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  react-router: 8.5.0
  # React's own Flight reply codec, only to test the server-function serializer against it (D54)
  react-server-dom-parcel: 19.3.1
  tailwindcss: 4.3.3
  cn: 0.5.0
  lucide-react: 1.59.0
  radix-ui: 1.8.1
  '@base-ui/react': 1.9.0
  cmdk: 1.1.1
  vaul: 1.1.2
  sonner: 2.0.8
  embla-carousel-react: 8.6.0
  react-day-picker: 10.0.2
  react-resizable-panels: 4.14.7
  input-otp: 1.5.0
  recharts: 3.10.1
  uplot: 1.6.32
  echarts: 6.1.0
  '@tanstack/react-table': 9.3.1
  react-hook-form: 7.90.0
  '@hookform/resolvers': 5.9.2
  motion: 14.4.0
  mermaid: 12.2.0
  '@xyflow/react': 12.12.0
  shiki: 4.5.0
  codemirror: 6.0.2
  '@codemirror/state': 6.7.6
  '@codemirror/view': 6.43.15
  '@codemirror/commands': 6.11.1
  '@codemirror/language': 6.13.1
  '@codemirror/lang-javascript': 6.2.5
  '@codemirror/lang-json': 6.0.2
  '@codemirror/lang-markdown': 6.5.2
  '@codemirror/lang-css': 6.3.1
  '@codemirror/lang-html': 6.4.12
  '@codemirror/lang-python': 6.2.1
  katex: 0.19.0
  '@xterm/xterm': 6.0.0
  '@xterm/addon-fit': 0.11.0
  '@xterm/addon-webgl': 0.19.0
  '@xterm/addon-unicode11': 0.9.0

  # Build, types and tests
  typescript: 7.0.2
  tsdown: 0.23.1
  turbo: 2.11.9
  vitest: 5.0.5
  '@vitest/browser-playwright': 5.0.5
  fast-check: 4.10.2
  '@playwright/test': 1.64.1
  playwright: 1.64.1
  # verify's runner (WP-09, D138): playwright-core with the Chromium headless shell 1.64.0 pins
  # (Renovate moves it with playwright), axe-core injected unmodified, pixelmatch over pngjs
  playwright-core: 1.64.1
  axe-core: 4.14.0
  pixelmatch: 8.0.0
  pngjs: 7.0.0
  '@types/pngjs': 6.0.5
  '@types/node': 24.19.2
  '@types/better-sqlite3': 9.6.0

  # Lint, format and boundaries
  '@biomejs/biome': 2.5.15
  eslint: 10.13.0
  eslint-plugin-react-hooks: 7.1.1
  typescript-eslint: 8.72.0
  dependency-cruiser: 18.7.0
  knip: 6.42.1

  # API surface and packaging
  '@microsoft/api-extractor': 7.59.4
  publint: 0.3.25
  '@arethetypeswrong/cli': 0.18.5
  size-limit: 14.2.0
  '@size-limit/preset-small-lib': 14.2.0

  # Repository workflow
  '@changesets/cli': 3.0.3
  '@changesets/changelog-github': 1.0.1
  lefthook: 2.2.1
  yaml: 2.9.1
  spdx-expression-parse: 5.0.0
  '@types/spdx-expression-parse': 4.0.0

catalogs:
  # TypeScript 7 has no JavaScript compiler API. Tools that need it (API Extractor,
  # typescript-eslint) resolve this pinned TypeScript 6 instead (REPO_STANDARDS §4).
  ts6:
    typescript: 6.0.3
