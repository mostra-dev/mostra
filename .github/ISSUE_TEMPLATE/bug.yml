name: Bug report
description: Something in Mostra doesn't work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include diagnostic codes (MOSTRA_…) and the command or API you used.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest artifact or command sequence that shows it.
  - type: input
    id: version
    attributes:
      label: Mostra version and platform
      placeholder: "@mostra/cli 0.x, macOS 26 arm64"
