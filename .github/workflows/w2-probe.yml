# A disposable probe of the Windows facts WP-W2's design relies on (removed before the package
# merges): worker exit codes, port binds and Windows Firewall, the default browser's opener, file
# events, Task Scheduler as a per-user login service, and Playwright's engines on each runner.
name: Windows probe (WP-W2, temporary)

on:
  push:
    branches: ["wp/w2-*"]
    paths:
      - ".github/w2-probe/**"
      - ".github/workflows/w2-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: w2-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: probe (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Node facts
        run: node .github/w2-probe/probe.mjs
      - name: A second local user
        shell: pwsh
        run: |
          $password = "Mw2-" + [guid]::NewGuid().ToString("N").Substring(0, 10) + "!"
          New-LocalUser -Name mostraother -Password (ConvertTo-SecureString $password -AsPlainText -Force) -PasswordNeverExpires -AccountNeverExpires | Out-Null
          "::add-mask::$password"
          "MOSTRA_TEST_OTHER_USER=mostraother" >> $env:GITHUB_ENV
          "MOSTRA_TEST_OTHER_PASSWORD=$password" >> $env:GITHUB_ENV
      - name: Firewall and Task Scheduler facts
        shell: pwsh
        run: ./.github/w2-probe/probe.ps1
      - name: Playwright engines
        shell: bash
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm install --silent playwright-core@1.64.0 playwright@1.64.0 >/dev/null
          for engine in chromium firefox webkit; do
            if npx playwright install "$engine" > "$engine.log" 2>&1; then echo "engine $engine: installed"; else echo "engine $engine: FAILED"; tail -5 "$engine.log"; fi
          done
