# The pull-request and main-branch gates (REPO_STANDARDS §6). Every job runs exactly one job of
# `pnpm check` (tools/check/jobs.ts), so a job that passes here passes locally and the reverse.
# Later work packages add their suites to these jobs, not new workflow files.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Pull requests check what they affect; main checks everything.
  SCOPE: ${{ github.event_name == 'pull_request' && '--affected' || '' }}
  # The pull request's own head, so the commits job skips GitHub's synthetic merge commit.
  MOSTRA_HEAD: ${{ github.event.pull_request.head.sha }}
  LEFTHOOK: "0"
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"
  FORCE_COLOR: "0"

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          job: plan
      - name: Compute the affected jobs
        id: plan
        run: |
          plan=$(node tools/check/cli.ts --plan --json $SCOPE)
          echo "$plan"
          echo "jobs=$(node -e 'console.log(JSON.stringify(JSON.parse(process.argv[1]).jobs))' "$plan")" >> "$GITHUB_OUTPUT"
          {
            echo "### Plan"
            echo
            echo '```json'
            echo "$plan"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  check:
    name: ${{ matrix.job }}
    needs: plan
    if: needs.plan.outputs.jobs != '[]'
    strategy:
      fail-fast: false
      matrix:
        job: [format-lint, types, unit, hygiene, build, boundaries, api, licenses, docs, commits]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Skip when not affected
        id: gate
        env:
          JOBS: ${{ needs.plan.outputs.jobs }}
          JOB: ${{ matrix.job }}
        run: |
          if echo "$JOBS" | grep -q "\"$JOB\""; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not affected by this change." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.run
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        if: steps.gate.outputs.run
        with:
          job: ${{ matrix.job }}
      - name: Rust toolchain cache
        if: steps.gate.outputs.run && (matrix.job == 'format-lint' || matrix.job == 'unit')
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.job }}
      - name: Install cargo-deny
        if: steps.gate.outputs.run && matrix.job == 'unit'
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-deny@0.20.2
      - name: pnpm check --job ${{ matrix.job }}
        if: steps.gate.outputs.run
        env:
          JOB: ${{ matrix.job }}
        run: node tools/check/cli.ts --job "$JOB" $SCOPE --verbose

  rust:
    name: rust (${{ matrix.os }})
    needs: plan
    if: contains(needs.plan.outputs.jobs, '"rust"')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          job: rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest@0.9.146,cargo-deny@0.20.2
      - name: pnpm check --job rust
        run: node tools/check/cli.ts --job rust $SCOPE --verbose

  # Suites through real Mostra processes (sockets, process groups, start times) on both v1
  # platforms (D86). The plan runs it only when the runtime or the protocol is affected.
  integration:
    name: integration (${{ matrix.os }})
    needs: plan
    if: contains(needs.plan.outputs.jobs, '"integration"')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          job: integration
      # Built versions are rendered in Chromium (WP-03, AU-01, AU-02).
      - name: Cache the Playwright browser
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install the Playwright Chromium headless shell
        run: pnpm --filter @mostra/runtime exec playwright install --with-deps --only-shell chromium
      - name: pnpm check --job integration
        run: node tools/check/cli.ts --job integration $SCOPE --verbose

  # Capability links in Chromium, Firefox and WebKit through the real gateway (WP-05), on both v1
  # platforms: WebKit on macOS is the closest Playwright gets to Safari.
  e2e:
    name: e2e (${{ matrix.os }})
    needs: plan
    if: contains(needs.plan.outputs.jobs, '"e2e"')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          job: e2e
      - name: Cache the Playwright browsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium, Firefox and WebKit
        run: pnpm --filter @mostra/e2e exec playwright install --with-deps chromium firefox webkit
      - name: pnpm check --job e2e
        run: node tools/check/cli.ts --job e2e $SCOPE --verbose
      - name: Keep the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-traces-${{ matrix.os }}
          path: tests/e2e/test-results
          retention-days: 7

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, BUSL-1.1, SSPL-1.0, Elastic-2.0

  # The one check branch protection requires: green only when every job above passed or was skipped.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [plan, check, rust, integration, e2e, dependency-review]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: All gates passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled)"'; then exit 1; fi
