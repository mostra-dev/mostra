# The pull-request, merge-queue and nightly gates (REPO_STANDARDS §6, D152). The plan job decides
# what runs and where (tools/check/ci.ts): each job below runs one part of `pnpm check`
# (tools/check/jobs.ts) on the machines the plan lists, so a job that passes here passes locally
# and the reverse, and a job no change needs takes no runner.
#
#   pull request          affected jobs; Linux, macOS, Windows x64; release rehearsed on linux-x64
#   label ci:full         everything, as the merge queue runs it
#   a bot's draft         nothing, until it is ready for review (gh pr ready)
#   merge queue           affected jobs on every leg, Windows arm64 and every release platform too
#   nightly (main)        everything, unless the last nightly run passed on the same commit
#                         within 5½ days; Linux legs on Blacksmith run on GitHub's runners too, so
#                         both cache stores stay warm (#86)
#   by hand               everything (`full: false` for the affected jobs)
#
# Linux jobs run on Blacksmith while its monthly budget lasts and on GitHub's runners otherwise
# (.github/actions/runners); macOS and Windows always on GitHub's.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: Check every package (off checks only what the branch changed since main)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # The pull request's own head, so the commits job skips GitHub's synthetic merge commit.
  MOSTRA_HEAD: ${{ github.event.pull_request.head.sha }}
  # In the merge queue, what the group is compared against: main as the queue found it.
  MOSTRA_BASE: ${{ github.event.merge_group.base_sha }}
  LEFTHOOK: "0"
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"
  FORCE_COLOR: "0"

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # the nightly run looks up the last nightly run
      pull-requests: read # a pull request's draft state and labels as they are now
    outputs:
      run: ${{ steps.plan.outputs.run }}
      scope: ${{ steps.plan.outputs.scope }}
      static: ${{ steps.plan.outputs.static }}
      unit: ${{ steps.plan.outputs.unit }}
      hygiene: ${{ steps.plan.outputs.hygiene }}
      integration: ${{ steps.plan.outputs.integration }}
      windows: ${{ steps.plan.outputs.windows }}
      e2e: ${{ steps.plan.outputs.e2e }}
      rust: ${{ steps.plan.outputs.rust }}
      conformance: ${{ steps.plan.outputs.conformance }}
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.release.outputs.version }}
      rehearse: ${{ steps.release.outputs.rehearse }}
      node: ${{ steps.release.outputs.node }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # Before anything is installed: the token reaches only Blacksmith's pinned CLI. A fork's pull
      # request gets no secrets, so its token is empty and its Linux jobs run on GitHub's runners.
      - name: Choose the runners
        id: runners
        uses: ./.github/actions/runners
        with:
          token: ${{ secrets.BLACKSMITH_TOKEN }}
          policy: ${{ vars.CI_RUNNERS }}
          budget: ${{ vars.BLACKSMITH_BUDGET }}
          threshold: ${{ vars.BLACKSMITH_THRESHOLD }}
      # The recent nightly runs, each with how many of its gates passed: ci.ts skips this run while
      # the newest one on this commit that ran its gates passed under 5½ days ago, so both cache
      # stores are read inside their 7-day eviction (#86); a run that only skipped renews nothing.
      - name: The recent nightly runs (nightly only)
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --event schedule --branch main --status completed --limit 10 --json databaseId,headSha,createdAt,conclusion > "$RUNNER_TEMP/runs.json"
          jq -c '.[]' "$RUNNER_TEMP/runs.json" | while read -r run; do
            gates=0
            if [ "$(jq -r .headSha <<< "$run")" = "$SHA" ]; then
              gates=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$(jq -r .databaseId <<< "$run")/jobs?per_page=100" --jq '[.jobs[] | select(.name != "plan" and .name != "ci-ok" and .conclusion == "success")] | length')
            fi
            jq -c --argjson gates "$gates" '{headSha, createdAt, conclusion, gates: $gates}' <<< "$run"
          done | jq -s . > "$RUNNER_TEMP/nightlies.json"
          echo "MOSTRA_CI_NIGHTLIES=$RUNNER_TEMP/nightlies.json" >> "$GITHUB_ENV"
      # As they are now, not as the event saw them: a re-run after adding ci:full honors it.
      - name: The pull request as it is now (pull requests only)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" > "$RUNNER_TEMP/pull.json"
      - uses: ./.github/actions/setup
        id: setup
        with:
          job: plan
      - name: What runs, and where
        id: plan
        env:
          MOSTRA_CI_RUNNERS: ${{ steps.runners.outputs.runners }}
          MOSTRA_CI_PULL: ${{ runner.temp }}/pull.json
        run: node tools/check/ci.ts
      # The version the release rehearsal builds (D143, #69): the pending changesets' version, or
      # the next patch when npm already has this one.
      - name: The rehearsal's version
        id: release
        if: steps.plan.outputs.release != 'null'
        run: |
          node tools/release/versions.ts plan >> "$GITHUB_OUTPUT"
          echo "node=$(node -p 'require("./packages/bundle/node.json").version')" >> "$GITHUB_OUTPUT"

  # The cheap checks together on one machine (format-lint, types, build, boundaries, api, licenses,
  # docs, commits, as the change needs them): one Turborepo run shares their builds.
  static:
    name: static (${{ matrix.leg.names }})
    needs: plan
    if: needs.plan.outputs.static != '[]'
    strategy:
      matrix:
        leg: ${{ fromJSON(needs.plan.outputs.static) }}
    runs-on: ${{ matrix.leg.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        id: setup
        with:
          job: ${{ matrix.leg.cache }}
      - name: Rust toolchain cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: static
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: pnpm check ${{ matrix.leg.jobs }}
        env:
          JOBS: ${{ matrix.leg.jobs }}
          SCOPE: ${{ needs.plan.outputs.scope }}
        run: node tools/check/cli.ts $JOBS $SCOPE --verbose
      # Also after a failed run (Turbo caches only the tasks that passed), so a cold run that fails
      # still leaves what it built for the next (the Opus review of MT-02).
      - name: Save the Turborepo cache (main only)
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .turbo/cache
          key: ${{ steps.setup.outputs.turbo-key }}

  unit:
    name: unit (${{ matrix.leg.os }})
    needs: plan
    if: needs.plan.outputs.unit != '[]'
    strategy:
      matrix:
        leg: ${{ fromJSON(needs.plan.outputs.unit) }}
    runs-on: ${{ matrix.leg.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        id: setup
        with:
          job: ${{ matrix.leg.cache }}
      - name: Rust toolchain cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: unit
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-deny
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2
      # @mostra/react's hooks render in Chromium (Vitest browser mode, WP-07, AU-08).
      - uses: ./.github/actions/browsers
        with:
          browser: chromium-headless-shell
          package: "@mostra/react"
          image: ${{ steps.setup.outputs.image }}
      - name: pnpm check --job unit
        env:
          SCOPE: ${{ needs.plan.outputs.scope }}
        run: node tools/check/cli.ts --job unit $SCOPE --verbose
      # Also after a failed run (Turbo caches only the tasks that passed), so a cold run that fails
      # still leaves what it built for the next (the Opus review of MT-02).
      - name: Save the Turborepo cache (main only)
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .turbo/cache
          key: ${{ steps.setup.outputs.turbo-key }}

  hygiene:
    name: hygiene (${{ matrix.leg.os }})
    needs: plan
    if: needs.plan.outputs.hygiene != '[]'
    strategy:
      matrix:
        leg: ${{ fromJSON(needs.plan.outputs.hygiene) }}
    runs-on: ${{ matrix.leg.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        id: setup
        with:
          job: ${{ matrix.leg.cache }}
      - name: pnpm check --job hygiene
        env:
          SCOPE: ${{ needs.plan.outputs.scope }}
        run: node tools/check/cli.ts --job hygiene $SCOPE --verbose
      # Also after a failed run (Turbo caches only the tasks that passed), so a cold run that fails
      # still leaves what it built for the next (the Opus review of MT-02).
      - name: Save the Turborepo cache (main only)
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .turbo/cache
          key: ${{ steps.setup.outputs.turbo-key }}

  rust:
    name: rust (${{ matrix.leg.os }})
    needs: plan
    if: needs.plan.outputs.rust != '[]'
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.plan.outputs.rust) }}
    runs-on: ${{ matrix.leg.runner }}
    # Windows compiles the workspace from cold in about as long as the rest takes (WP-W3).
    timeout-minutes: &rust-timeout ${{ startsWith(matrix.leg.os, 'windows') && 35 || 15 }}
    defaults: &rust-defaults
      run:
        shell: bash
    steps: &rust-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        id: setup
        with:
          job: ${{ matrix.leg.cache }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.146,cargo-deny@0.20.2
      # The runtime the crate's suites spawn needs its Windows helper (D150), and the pipe-owner
      # check a second local user (D150 item 4, WP-W3).
      - name: Build the Windows helper
        if: runner.os == 'Windows'
        run: cargo build -p mostra-win --release --locked
      - name: A second local user, for the pipe-owner check
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $password = "Mw3-" + [guid]::NewGuid().ToString("N").Substring(0, 10) + "!"
          New-LocalUser -Name mostraother -Password (ConvertTo-SecureString $password -AsPlainText -Force) -PasswordNeverExpires -AccountNeverExpires | Out-Null
          "::add-mask::$password"
          "MOSTRA_TEST_OTHER_USER=mostraother" >> $env:GITHUB_ENV
          "MOSTRA_TEST_OTHER_PASSWORD=$password" >> $env:GITHUB_ENV
      - name: pnpm check --job rust
        env:
          # The crate's instance suites fail, never skip, when the runtime didn't build.
          MOSTRA_HOST_REQUIRE_RUNTIME: "1"
          SCOPE: ${{ needs.plan.outputs.scope }}
        run: node tools/check/cli.ts --job rust $SCOPE --verbose
      # Also after a failed run (Turbo caches only the tasks that passed), so a cold run that fails
      # still leaves what it built for the next (the Opus review of MT-02).
      - name: Save the Turborepo cache (main only)
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .turbo/cache
          key: ${{ steps.setup.outputs.turbo-key }}

  # The host conformance kit against the Rust reference host on macOS, Linux and Windows (HO-05):
  # every port, standalone, and broken with its baseline. The TypeScript reference host runs in
  # the integration job's `clients` group. The kit's shell scenario renders in Chromium.
  conformance:
    name: conformance (${{ matrix.leg.os }})
    needs: plan
    if: needs.plan.outputs.conformance != '[]'
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.plan.outputs.conformance) }}
    runs-on: ${{ matrix.leg.runner }}
    timeout-minutes: &conformance-timeout ${{ startsWith(matrix.leg.os, 'windows') && 35 || 20 }}
    defaults: &conformance-defaults
      run:
        shell: bash
    steps: &conformance-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        id: setup
        with:
          job: ${{ matrix.leg.cache }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the Windows helper
        if: runner.os == 'Windows'
        run: cargo build -p mostra-win --release --locked
      - uses: ./.github/actions/browsers
        with:
          browser: chromium-headless-shell
          package: "@mostra/runtime"
          image: ${{ steps.setup.outputs.image }}
      - name: pnpm check --job conformance
        env:
          SCOPE: ${{ needs.plan.outputs.scope }}
        run: node tools/check/cli.ts --job conformance $SCOPE --verbose
      # Also after a failed run (Turbo caches only the tasks that passed), so a cold run that fails
      # still leaves what it built for the next (the Opus review of MT-02).
      - name: Save the Turborepo cache (main only)
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .turbo/cache
          key: ${{ steps.setup.outputs.turbo-key }}

  # Suites through real Mostra processes (sockets, process groups, start times) on both POSIX
  # platforms (D86), in groups, one machine each (`MOSTRA_TEST_GROUP`,
  # packages/runtime/vitest.config.ts): the clients' suites have their own (WP-11), so their
  # instances never starve the runtime's.
  integration:
    name: integration (${{ matrix.leg.os }}, ${{ matrix.leg.group }})
    needs: plan
    if: needs.plan.outputs.integration != '[]'
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.plan.outputs.integration) }}
    runs-on: ${{ matrix.leg.runner }}
    timeout-minutes: &integration-timeout 15
    env: &integration-env
      MOSTRA_TEST_GROUP: ${{ matrix.leg.group }}
    steps: &integration-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        id: setup
        with:
          job: ${{ matrix.leg.cache }}
      # Built versions are rendered in Chromium (WP-03, AU-01, AU-02).
      - uses: ./.github/actions/browsers
        with:
          browser: chromium-headless-shell
          package: "@mostra/runtime"
          image: ${{ steps.setup.outputs.image }}
      # A backup replicator reads a live hosted ledger (D165 item 0b): the remote group's Linux legs
      # fetch Litestream, checked against its pinned SHA-256, so `replicator.test.ts` runs where the
      # container image runs (WP-30; WP-29 ran it on macOS only). A test tool, never bundled.
      - name: Litestream for the replicator test
        if: matrix.leg.group == 'remote' && runner.os == 'Linux' && runner.arch == 'X64'
        env:
          LITESTREAM_VERSION: 0.5.18
          LITESTREAM_SHA256: d3687b9fd0f2e9426bbd3da828429ff3f1dfc5c9b74d54fdf028e4ee510e7dea
        run: |
          dir="$RUNNER_TEMP/litestream"
          mkdir -p "$dir"
          archive="$dir/litestream.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/benbjohnson/litestream/releases/download/v${LITESTREAM_VERSION}/litestream-${LITESTREAM_VERSION}-linux-x86_64.tar.gz"
          echo "${LITESTREAM_SHA256}  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$dir"
          "$dir/litestream" version
          echo "MOSTRA_TEST_LITESTREAM=$dir/litestream" >> "$GITHUB_ENV"
      # A run still going at 10 minutes (the slowest leg takes about 6) lists every process, keeps
      # the supervisor logs its test homes still hold and fails, so the step below keeps them: a job
      # cancelled for its own limit keeps nothing (#55). The step's limit is the backstop.
      - name: pnpm check --job integration
        timeout-minutes: 12
        env:
          SCOPE: ${{ needs.plan.outputs.scope }}
          MOSTRA_TEST_LOG_DIR: ${{ runner.temp }}/mostra-test-logs
        run: node tools/check/cli.ts --job integration $SCOPE --verbose --stream --deadline 10
      # Also after a failed run (Turbo caches only the tasks that passed), so a cold run that fails
      # still leaves what it built for the next (the Opus review of MT-02).
      - name: Save the Turborepo cache (main only)
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .turbo/cache
          key: ${{ steps.setup.outputs.turbo-key }}
      # A supervisor that stopped answering mid-suite leaves only its log to say why (#35, #55).
      - name: Keep the test homes' supervisor logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-integration-${{ matrix.leg.group }}-${{ matrix.leg.os }}${{ matrix.leg.retry && '-retry' || '' }}
          path: ${{ runner.temp }}/mostra-test-logs
          retention-days: 7
          if-no-files-found: ignore

  # The Windows legs (WP-W1 to WP-W3, D146): the unit, hygiene and integration jobs for the
  # packages Windows runs (`WINDOWS_PACKAGES` in tools/check/jobs.ts), on x64 (and arm64 in the
  # merge queue, nightly and with ci:full). The runtime finds the Windows helper Cargo builds here
  # (`crates/mostra-win`). The integration suites run in groups, one machine each
  # (packages/runtime/vitest.config.ts), with a second local user for the access checks (RT-10,
  # RT-11).
  windows:
    name: ${{ matrix.leg.job }} (${{ matrix.leg.os }}${{ matrix.leg.job == 'integration' && format(', {0}', matrix.leg.group) || '' }})
    needs: plan
    if: needs.plan.outputs.windows != '[]'
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.plan.outputs.windows) }}
    runs-on: ${{ matrix.leg.runner }}
    timeout-minutes: &windows-timeout 25
    env: &windows-env
      MOSTRA_TEST_GROUP: ${{ matrix.leg.group }}
    defaults: &windows-defaults
      run:
        shell: bash
    steps: &windows-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        id: setup
        with:
          job: ${{ matrix.leg.cache }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: windows-helper
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the Windows helper
        run: cargo build -p mostra-win --release --locked
      # The helper's Windows code compiles only on Windows, so the static job's clippy (Linux)
      # never sees it; it is linted here, on each architecture.
      - name: Lint the Windows helper
        if: matrix.leg.job == 'unit'
        run: cargo clippy -p mostra-win --all-targets --locked -- -D warnings
      - name: A second local user, for the access checks (RT-10)
        if: matrix.leg.job != 'unit'
        shell: pwsh
        run: |
          $password = "Mw1-" + [guid]::NewGuid().ToString("N").Substring(0, 10) + "!"
          New-LocalUser -Name mostraother -Password (ConvertTo-SecureString $password -AsPlainText -Force) -PasswordNeverExpires -AccountNeverExpires | Out-Null
          "::add-mask::$password"
          "MOSTRA_TEST_OTHER_USER=mostraother" >> $env:GITHUB_ENV
          "MOSTRA_TEST_OTHER_PASSWORD=$password" >> $env:GITHUB_ENV
      # The firewall check (RT-11): the firewall on in every profile, and blocked listeners logged
      # (event 5031), so the gateway suite can show a loopback bind is never blocked, against a
      # wildcard control that is.
      - name: The firewall on, its blocks audited (RT-11)
        if: matrix.leg.group == 'windows-gateway'
        shell: pwsh
        run: |
          Set-NetFirewallProfile -All -Enabled True
          auditpol /set /subcategory:"Filtering Platform Connection" /success:enable /failure:enable
      # Built versions and verify render in Chromium; @mostra/react's hooks too (Vitest browser mode).
      - uses: ./.github/actions/browsers
        with:
          browser: chromium-headless-shell
          package: "@mostra/runtime"
          image: ${{ steps.setup.outputs.image }}
      # A run still going at 14 minutes (arm64's slowest group takes about 11) reports and fails
      # before the job's limit, as the POSIX integration job does (#55); the step's limit is the
      # backstop.
      - name: pnpm check --job ${{ matrix.leg.job }}
        timeout-minutes: 16
        env:
          JOB: ${{ matrix.leg.job }}
          SCOPE: ${{ needs.plan.outputs.scope }}
          MOSTRA_TEST_LOG_DIR: ${{ runner.temp }}/mostra-test-logs
        run: |
          # The unit job's ledgers and bundles in the workspace's own disk (D: on x64; arm64 has
          # only C:): beside the SDK's and the kit's suites, a runtime suite's 250 synchronous
          # commits on C: ran past their 30 s, where they took 16 s alone (#66, D153 item 10).
          # The other jobs keep %TEMP%, whose access list their access checks rely on.
          if [ "$JOB" = unit ]; then export TEMP="$RUNNER_TEMP" TMP="$RUNNER_TEMP"; fi
          node tools/check/cli.ts --job "$JOB" $SCOPE --verbose --stream --deadline 14
      # Also after a failed run (Turbo caches only the tasks that passed), so a cold run that fails
      # still leaves what it built for the next (the Opus review of MT-02).
      - name: Save the Turborepo cache (main only)
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .turbo/cache
          key: ${{ steps.setup.outputs.turbo-key }}
      - name: Keep the test homes' supervisor logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-${{ matrix.leg.job }}-${{ matrix.leg.group }}-${{ matrix.leg.os }}${{ matrix.leg.retry && '-retry' || '' }}
          path: ${{ runner.temp }}/mostra-test-logs
          retention-days: 7
          if-no-files-found: ignore

  # Capability links in Chromium, Firefox and WebKit through the real gateway (WP-05), one engine
  # per machine (WP-12: three on one macOS runner went past 15 minutes). WebKit on macOS is the
  # closest Playwright gets to Safari. Windows' viewers are Chromium's (Chrome, Edge) and Firefox:
  # Playwright's WebKit there keeps no SameSite on cookies, and its Windows browsers are x64
  # builds, so arm64 runs Chromium only (emulated Firefox closed pages by itself, #66; D151 item 8).
  e2e:
    name: e2e (${{ matrix.leg.os }}, ${{ matrix.leg.browser }}${{ matrix.leg.shard && format(', {0}', matrix.leg.shard) || '' }})
    needs: plan
    if: needs.plan.outputs.e2e != '[]'
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.plan.outputs.e2e) }}
    runs-on: ${{ matrix.leg.runner }}
    # On Linux and Windows the tests take up to about 20 minutes (Windows arm64's emulated Chromium
    # in three parts); the rest is room for a slow mirror's first run on an image (#58), before its
    # downloads are cached. macOS's runners vary most: its WebKit took 8.6 to 23 minutes on the
    # same suite in one day (WP-18's runs), so its legs get 35.
    timeout-minutes: &e2e-timeout ${{ matrix.leg.os == 'macos' && 35 || 25 }}
    env: &e2e-env
      MOSTRA_E2E_BROWSER: ${{ matrix.leg.browser }}
      MOSTRA_E2E_SHARD: ${{ matrix.leg.shard || '' }}
    defaults: &e2e-defaults
      run:
        shell: bash
    steps: &e2e-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        id: setup
        with:
          job: ${{ matrix.leg.cache }}
      # The runtime's Windows helper (D150).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.os == 'Windows'
        with:
          key: windows-helper
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the Windows helper
        if: runner.os == 'Windows'
        run: cargo build -p mostra-win --release --locked
      - uses: ./.github/actions/browsers
        with:
          browser: ${{ matrix.leg.browser }}
          package: "@mostra/e2e"
          image: ${{ steps.setup.outputs.image }}
      - name: pnpm check --job e2e
        env:
          SCOPE: ${{ needs.plan.outputs.scope }}
          MOSTRA_E2E_LOG_DIR: ${{ runner.temp }}/mostra-e2e-logs
        run: node tools/check/cli.ts --job e2e $SCOPE --verbose
      # Also after a failed run (Turbo caches only the tasks that passed), so a cold run that fails
      # still leaves what it built for the next (the Opus review of MT-02).
      - name: Save the Turborepo cache (main only)
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .turbo/cache
          key: ${{ steps.setup.outputs.turbo-key }}
      - name: Keep the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces-${{ matrix.leg.os }}-${{ matrix.leg.browser }}-${{ strategy.job-index }}${{ matrix.leg.retry && '-retry' || '' }}
          path: tests/e2e/test-results
          retention-days: 7
      # A trace shows what the browser saw; the daemons' logs and ledgers show what reached Mostra
      # (#39). Never their keys or secrets (tests/e2e/support/mostra.ts).
      - name: Keep the daemons' logs and ledgers
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-homes-${{ matrix.leg.os }}-${{ matrix.leg.browser }}-${{ strategy.job-index }}${{ matrix.leg.retry && '-retry' || '' }}
          path: ${{ runner.temp }}/mostra-e2e-logs
          retention-days: 7
          if-no-files-found: ignore

  # The release rehearsal (EN-05, D142 item 9): bundles built, audited and smoke-tested with no
  # Node.js, every package packed and dry-run published, the npm path smoke-tested. Pull requests
  # rehearse linux-x64 unless distribution files changed; the merge queue rehearses every platform,
  # so nothing reaches main that breaks a bundle.
  release:
    name: release
    needs: plan
    if: needs.plan.outputs.release != 'null' && needs.plan.outputs.release != ''
    uses: ./.github/workflows/release-build.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      rehearse: ${{ needs.plan.outputs.rehearse == 'true' }}
      mode: fresh
      node: ${{ needs.plan.outputs.node }}
      platforms: ${{ toJSON(fromJSON(needs.plan.outputs.release).platforms) }}
      npm-smoke: ${{ toJSON(fromJSON(needs.plan.outputs.release).npmSmoke) }}
      linux-runner: ${{ fromJSON(needs.plan.outputs.release).linux }}
      rehearsal: true

  dependency-review:
    name: dependency review
    needs: plan
    if: github.event_name == 'pull_request' && needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, BUSL-1.1, SSPL-1.0, Elastic-2.0

  # Legs GitHub never gave a runner (#210): its macOS arm64 pool sometimes waits, then cancels a
  # job with no runner and no step run, and a matrix with such a leg reports `abandoned`, which
  # ci-ok refuses (D152 item 9). The merge queue decides on this run's ci-ok, so a re-run after it
  # ends comes too late. This job lists the run's jobs, picks exactly the legs GitHub starved (its
  # annotation says the job "was not acquired by Runner"), waits until 10 minutes after the last of
  # them, and hands them to the retry twins below, the release rehearsal to `release-retry`.
  # Nothing is retried when a gate also failed for its own reasons (tools/check/starved.ts).
  starved:
    name: starved
    needs: [plan, static, unit, hygiene, rust, conformance, integration, windows, e2e, release, dependency-review]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.run == 'true' && (contains(needs.*.result, 'abandoned') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'failure')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # its checkout
      actions: read # this run's jobs
      checks: read # their annotations
    outputs:
      rust: ${{ steps.select.outputs.rust }}
      conformance: ${{ steps.select.outputs.conformance }}
      integration: ${{ steps.select.outputs.integration }}
      windows: ${{ steps.select.outputs.windows }}
      e2e: ${{ steps.select.outputs.e2e }}
      release: ${{ steps.select.outputs.release }}
      eligible: ${{ steps.select.outputs.eligible }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: The legs GitHub gave no runner
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN: ${{ toJSON(needs.plan.outputs) }}
        run: node tools/check/starved.ts select

  # Each gate's retry twin runs the starved legs with the gate's own steps, limits and machine
  # (YAML aliases of the gate's, which a test holds); `retry` on a leg only names its artifacts apart.
  rust-retry:
    name: retry · rust (${{ matrix.leg.os }})
    needs: [plan, starved]
    if: ${{ !cancelled() && needs.starved.result == 'success' && needs.starved.outputs.rust != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.starved.outputs.rust) }}
    runs-on: ${{ matrix.leg.runner }}
    timeout-minutes: *rust-timeout
    defaults: *rust-defaults
    steps: *rust-steps

  conformance-retry:
    name: retry · conformance (${{ matrix.leg.os }})
    needs: [plan, starved]
    if: ${{ !cancelled() && needs.starved.result == 'success' && needs.starved.outputs.conformance != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.starved.outputs.conformance) }}
    runs-on: ${{ matrix.leg.runner }}
    timeout-minutes: *conformance-timeout
    defaults: *conformance-defaults
    steps: *conformance-steps

  integration-retry:
    name: retry · integration (${{ matrix.leg.os }}, ${{ matrix.leg.group }})
    needs: [plan, starved]
    if: ${{ !cancelled() && needs.starved.result == 'success' && needs.starved.outputs.integration != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.starved.outputs.integration) }}
    runs-on: ${{ matrix.leg.runner }}
    timeout-minutes: *integration-timeout
    env: *integration-env
    steps: *integration-steps

  windows-retry:
    name: retry · ${{ matrix.leg.job }} (${{ matrix.leg.os }}${{ matrix.leg.job == 'integration' && format(', {0}', matrix.leg.group) || '' }})
    needs: [plan, starved]
    if: ${{ !cancelled() && needs.starved.result == 'success' && needs.starved.outputs.windows != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.starved.outputs.windows) }}
    runs-on: ${{ matrix.leg.runner }}
    timeout-minutes: *windows-timeout
    env: *windows-env
    defaults: *windows-defaults
    steps: *windows-steps

  e2e-retry:
    name: retry · e2e (${{ matrix.leg.os }}, ${{ matrix.leg.browser }}${{ matrix.leg.shard && format(', {0}', matrix.leg.shard) || '' }})
    needs: [plan, starved]
    if: ${{ !cancelled() && needs.starved.result == 'success' && needs.starved.outputs.e2e != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.starved.outputs.e2e) }}
    runs-on: ${{ matrix.leg.runner }}
    timeout-minutes: *e2e-timeout
    env: *e2e-env
    defaults: *e2e-defaults
    steps: *e2e-steps

  # What is left of the rehearsal: the starved legs and what waited on them, from the artifacts the
  # first call kept (release-build.yml's `resume`).
  release-retry:
    name: retry · release
    needs: [plan, starved]
    if: ${{ !cancelled() && needs.starved.result == 'success' && needs.starved.outputs.release != '' }}
    uses: ./.github/workflows/release-build.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      rehearse: ${{ needs.plan.outputs.rehearse == 'true' }}
      mode: fresh
      node: ${{ needs.plan.outputs.node }}
      platforms: ${{ toJSON(fromJSON(needs.plan.outputs.release).platforms) }}
      npm-smoke: ${{ toJSON(fromJSON(needs.plan.outputs.release).npmSmoke) }}
      linux-runner: ${{ fromJSON(needs.plan.outputs.release).linux }}
      rehearsal: true
      resume: ${{ needs.starved.outputs.release }}

  # The one check the main ruleset requires, on pull requests and in the merge queue: green only
  # when every gate passed or was skipped by the plan, or GitHub gave some of its legs no runner and
  # their retry passed (#210). It is skipped itself only when the plan
  # ran and decided the run checks nothing, which happens only for a bot's draft (that GitHub won't
  # merge) and a nightly run already done; a plan that failed fails it.
  ci-ok:
    name: ci-ok
    if: always() && (needs.plan.result != 'success' || needs.plan.outputs.run == 'true')
    needs:
      [plan, static, unit, hygiene, rust, conformance, integration, windows, e2e, release, dependency-review, starved, rust-retry, conformance-retry, integration-retry, windows-retry, e2e-retry, release-retry]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: All gates passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        # Passes only on results known to be good: a job that ran and passed, or one the plan left
        # out. Anything else fails, `abandoned` included (a leg that never got a runner, which a
        # list of bad results let through on #90) and any result GitHub adds (D152 item 9), unless
        # the starved job named the gate and its retry twin passed (#210).
        run: node tools/check/starved.ts verdict
