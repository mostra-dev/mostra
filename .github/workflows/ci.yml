# The pull-request and main-branch gates (REPO_STANDARDS §6). Every job runs exactly one job of
# `pnpm check` (tools/check/jobs.ts), so a job that passes here passes locally and the reverse.
# Later work packages add their suites to these jobs, not new workflow files.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Pull requests check what they affect; main checks everything.
  SCOPE: ${{ github.event_name == 'pull_request' && '--affected' || '' }}
  # The pull request's own head, so the commits job skips GitHub's synthetic merge commit.
  MOSTRA_HEAD: ${{ github.event.pull_request.head.sha }}
  LEFTHOOK: "0"
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"
  FORCE_COLOR: "0"

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          job: plan
      - name: Compute the affected jobs
        id: plan
        run: |
          plan=$(node tools/check/cli.ts --plan --json $SCOPE)
          echo "$plan"
          echo "jobs=$(node -e 'console.log(JSON.stringify(JSON.parse(process.argv[1]).jobs))' "$plan")" >> "$GITHUB_OUTPUT"
          {
            echo "### Plan"
            echo
            echo '```json'
            echo "$plan"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  check:
    name: ${{ matrix.job }}
    needs: plan
    if: needs.plan.outputs.jobs != '[]'
    strategy:
      fail-fast: false
      matrix:
        job: [format-lint, types, unit, hygiene, build, boundaries, api, licenses, docs, commits]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Skip when not affected
        id: gate
        env:
          JOBS: ${{ needs.plan.outputs.jobs }}
          JOB: ${{ matrix.job }}
        run: |
          if echo "$JOBS" | grep -q "\"$JOB\""; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not affected by this change." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.run
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        id: setup
        if: steps.gate.outputs.run
        with:
          job: ${{ matrix.job }}
      - name: Rust toolchain cache
        if: steps.gate.outputs.run && (matrix.job == 'format-lint' || matrix.job == 'unit')
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.job }}
      - name: Install cargo-deny
        if: steps.gate.outputs.run && matrix.job == 'unit'
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-deny@0.20.2
      # @mostra/react's hooks render in Chromium (Vitest browser mode, WP-07, AU-08).
      - name: Cache the Playwright browser
        if: steps.gate.outputs.run && matrix.job == 'unit'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-unit-${{ steps.setup.outputs.image }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install the Playwright Chromium headless shell
        if: steps.gate.outputs.run && matrix.job == 'unit'
        run: pnpm --filter @mostra/react exec playwright install --with-deps --only-shell chromium
      - name: pnpm check --job ${{ matrix.job }}
        if: steps.gate.outputs.run
        env:
          JOB: ${{ matrix.job }}
        run: node tools/check/cli.ts --job "$JOB" $SCOPE --verbose

  rust:
    name: rust (${{ matrix.os }})
    needs: plan
    if: contains(needs.plan.outputs.jobs, '"rust"')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          job: rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest@0.9.146,cargo-deny@0.20.2
      - name: pnpm check --job rust
        env:
          # The crate's instance suites fail, never skip, when the runtime didn't build.
          MOSTRA_HOST_REQUIRE_RUNTIME: "1"
        run: node tools/check/cli.ts --job rust $SCOPE --verbose

  # The host conformance kit against the Rust reference host on both v1 platforms (HO-05):
  # every port, standalone, and broken with its baseline. The TypeScript reference host runs in
  # the integration job's `clients` group. The kit's shell scenario renders in Chromium.
  conformance:
    name: conformance (${{ matrix.os }})
    needs: plan
    if: contains(needs.plan.outputs.jobs, '"conformance"')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        id: setup
        with:
          job: conformance
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Cache the Playwright browser
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-${{ steps.setup.outputs.image }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install the Playwright Chromium headless shell
        run: pnpm --filter @mostra/runtime exec playwright install --with-deps --only-shell chromium
      - name: pnpm check --job conformance
        run: node tools/check/cli.ts --job conformance $SCOPE --verbose

  # Suites through real Mostra processes (sockets, process groups, start times) on both v1
  # platforms (D86). The plan runs it when the runtime, the protocol or a client package (CLI,
  # SDK, create-mostra) is affected. The suites run in groups, one machine each
  # (`MOSTRA_TEST_GROUP`, packages/runtime/vitest.config.ts), so the job stays inside the
  # 10-minute target (D50): the clients' suites have their own (WP-11), so their instances never
  # starve the runtime's.
  integration:
    name: integration (${{ matrix.os }}, ${{ matrix.group }})
    needs: plan
    if: contains(needs.plan.outputs.jobs, '"integration"')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        group: [core, verify, verify-failures, clients]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      MOSTRA_TEST_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        id: setup
        with:
          job: integration
      # Built versions are rendered in Chromium (WP-03, AU-01, AU-02).
      - name: Cache the Playwright browser
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-${{ steps.setup.outputs.image }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install the Playwright Chromium headless shell
        run: pnpm --filter @mostra/runtime exec playwright install --with-deps --only-shell chromium
      - name: pnpm check --job integration
        run: node tools/check/cli.ts --job integration $SCOPE --verbose --stream

  # The Windows legs (WP-W1, WP-W2, D146): the unit, integration and hygiene jobs for the packages
  # ported so far (`WINDOWS_PACKAGES` in tools/check/jobs.ts), on x64 and arm64. The runtime runs on
  # Windows only behind the development switch `MOSTRA_DEV_WINDOWS`, which only these legs set; it
  # finds the Windows helper Cargo builds here (`crates/mostra-win`). The integration suites run in
  # groups, one machine each (packages/runtime/vitest.config.ts), with a second local user for the
  # access checks (RT-10, RT-11).
  windows:
    name: ${{ matrix.suite.job }} (${{ matrix.os }}${{ matrix.suite.job == 'integration' && format(', {0}', matrix.suite.group) || '' }})
    needs: plan
    if: contains(needs.plan.outputs.jobs, '"unit"') || contains(needs.plan.outputs.jobs, '"integration"') || contains(needs.plan.outputs.jobs, '"hygiene"')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
        suite:
          - { job: unit, group: windows }
          - { job: hygiene, group: windows }
          - { job: integration, group: windows }
          - { job: integration, group: windows-publish }
          - { job: integration, group: windows-gateway }
          - { job: integration, group: windows-workers }
          - { job: integration, group: windows-verify }
          - { job: integration, group: windows-verify-failures }
          - { job: integration, group: windows-clients }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      MOSTRA_DEV_WINDOWS: "1"
      MOSTRA_TEST_GROUP: ${{ matrix.suite.group }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Skip when not affected
        id: gate
        env:
          JOBS: ${{ needs.plan.outputs.jobs }}
          JOB: ${{ matrix.suite.job }}
        run: |
          if echo "$JOBS" | grep -q "\"$JOB\""; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not affected by this change." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.run
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        id: setup
        if: steps.gate.outputs.run
        with:
          job: windows-${{ matrix.suite.job }}-${{ matrix.suite.group }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.gate.outputs.run
        with:
          key: windows-helper
      - name: Build the Windows helper
        if: steps.gate.outputs.run
        run: cargo build -p mostra-win --release --locked
      # The helper's Windows code compiles only on Windows, so the format-lint job's clippy (Linux)
      # never sees it; it is linted here, on each architecture.
      - name: Lint the Windows helper
        if: steps.gate.outputs.run && matrix.suite.job == 'unit'
        run: cargo clippy -p mostra-win --all-targets --locked -- -D warnings
      - name: A second local user, for the access checks (RT-10)
        if: steps.gate.outputs.run && matrix.suite.job != 'unit'
        shell: pwsh
        run: |
          $password = "Mw1-" + [guid]::NewGuid().ToString("N").Substring(0, 10) + "!"
          New-LocalUser -Name mostraother -Password (ConvertTo-SecureString $password -AsPlainText -Force) -PasswordNeverExpires -AccountNeverExpires | Out-Null
          "::add-mask::$password"
          "MOSTRA_TEST_OTHER_USER=mostraother" >> $env:GITHUB_ENV
          "MOSTRA_TEST_OTHER_PASSWORD=$password" >> $env:GITHUB_ENV
      # The firewall check (RT-11): the firewall on in every profile, and blocked listeners logged
      # (event 5031), so the gateway suite can show a loopback bind is never blocked, against a
      # wildcard control that is.
      - name: The firewall on, its blocks audited (RT-11)
        if: steps.gate.outputs.run && matrix.suite.group == 'windows-gateway'
        shell: pwsh
        run: |
          Set-NetFirewallProfile -All -Enabled True
          auditpol /set /subcategory:"Filtering Platform Connection" /success:enable /failure:enable
      # Built versions and verify render in Chromium; @mostra/react's hooks too (Vitest browser mode).
      - name: Install the Playwright Chromium headless shell
        if: steps.gate.outputs.run
        run: pnpm --filter @mostra/runtime exec playwright install --only-shell chromium
      - name: pnpm check --job ${{ matrix.suite.job }}
        if: steps.gate.outputs.run
        env:
          JOB: ${{ matrix.suite.job }}
          MOSTRA_TEST_LOG_DIR: ${{ runner.temp }}/mostra-test-logs
        run: node tools/check/cli.ts --job "$JOB" $SCOPE --verbose --stream
      - name: Keep the test homes' supervisor logs
        if: failure() && steps.gate.outputs.run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-${{ matrix.suite.job }}-${{ matrix.suite.group }}-${{ matrix.os }}
          path: ${{ runner.temp }}/mostra-test-logs
          retention-days: 7
          if-no-files-found: ignore

  # Capability links in Chromium, Firefox and WebKit through the real gateway (WP-05), on both v1
  # platforms: WebKit on macOS is the closest Playwright gets to Safari.
  # One engine per machine (REPO_STANDARDS §6's matrix): the three on one macOS runner had grown to
  # 11 to 14 minutes of a 15-minute limit and went past it (WP-12).
  e2e:
    name: e2e (${{ matrix.os }}, ${{ matrix.browser }})
    needs: plan
    if: contains(needs.plan.outputs.jobs, '"e2e"')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]
        browser: [chromium, firefox, webkit]
        # No Safari runs on Windows, and Playwright's WebKit there is a port no viewer uses, whose
        # cookie store has no SameSite (Playwright's own tests expect `None` there): Windows'
        # viewers are Chromium's (Chrome, Edge) and Firefox (D151, VERIFIED_FACTS WP-W2).
        # Playwright ships only x64 browsers for Windows: on arm64 Firefox runs emulated and closed
        # pages by itself (#66), so Firefox runs on x64 and Chromium on both (D151 item 8, M38).
        exclude:
          - os: windows-latest
            browser: webkit
          - os: windows-11-arm
            browser: webkit
          - os: windows-11-arm
            browser: firefox
    runs-on: ${{ matrix.os }}
    # The tests take about 10 minutes at most; the rest is room for a slow mirror's first run on an
    # image (#58), before its downloads are cached.
    timeout-minutes: 25
    env:
      MOSTRA_E2E_BROWSER: ${{ matrix.browser }}
      # Windows runs only behind the development switch until WP-W3 (D146, D150).
      MOSTRA_DEV_WINDOWS: ${{ startsWith(matrix.os, 'windows') && '1' || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        id: setup
        with:
          job: e2e
      - name: Cache the Playwright browsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || runner.os == 'Windows' && '~\AppData\Local\ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-e2e-${{ matrix.browser }}-${{ steps.setup.outputs.image }}-${{ hashFiles('pnpm-lock.yaml') }}
      # An engine's system packages come from the image's apt mirror, which some days takes most
      # of the job's time (#58): apt keeps what it downloads in a cached directory, so a slow
      # mirror costs only the first run on an image.
      - name: Keep apt's downloads (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$HOME/apt-archives/partial"
          printf 'Dir::Cache::Archives "%s/apt-archives/";\nBinary::apt::APT::Keep-Downloaded-Packages "true";\nAPT::Keep-Downloaded-Packages "true";\n' "$HOME" | sudo tee /etc/apt/apt.conf.d/90mostra-keep-downloads
      - name: Cache apt's downloads (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/apt-archives/*.deb
          key: apt-e2e-${{ matrix.browser }}-${{ steps.setup.outputs.image }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            apt-e2e-${{ matrix.browser }}-${{ steps.setup.outputs.image }}-
      # The runtime's Windows helper (D150).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.os == 'Windows'
        with:
          key: windows-helper
      - name: Build the Windows helper
        if: runner.os == 'Windows'
        run: cargo build -p mostra-win --release --locked
      - name: Install the engine
        run: pnpm --filter @mostra/e2e exec playwright install --with-deps ${{ matrix.browser }}
      - name: pnpm check --job e2e
        run: node tools/check/cli.ts --job e2e $SCOPE --verbose
      - name: Keep the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-traces-${{ matrix.os }}-${{ matrix.browser }}
          path: tests/e2e/test-results
          retention-days: 7

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, BUSL-1.1, SSPL-1.0, Elastic-2.0

  # The one check branch protection requires: green only when every job above passed or was skipped.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [plan, check, rust, conformance, integration, windows, e2e, dependency-review]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: All gates passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled)"'; then exit 1; fi
