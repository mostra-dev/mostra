# RT-10's seeded violations on Windows (WP-W1), removed before the package merges: earlier runs
# of this workflow probed the facts in VERIFIED_FACTS (WP-W1); its scripts are in the branch's
# history (crates/mostra-win/probe/ before 7e90926).
name: Windows probe (WP-W1, temporary)

on:
  push:
    branches: ["wp/w1-*"]
    paths:
      - "crates/mostra-win/**"
      - ".github/workflows/windows-probe.yml"
      - "packages/runtime/scripts/prove-seeds.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # RT-10's seeded violations on Windows (prove-seeds.ts --only RT-10): each red with its seed,
  # green restored. Temporary, like the rest of this workflow: the record goes into WP-W1's report.
  seeds:
    name: seeds (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      MOSTRA_DEV_WINDOWS: "1"
      LEFTHOOK: "0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: cargo build -p mostra-win --release --locked
      - run: pnpm --filter @mostra/protocol --filter @mostra/react --filter @mostra/runtime build
      - name: A second local user
        shell: pwsh
        run: |
          $password = "Mw1-" + [guid]::NewGuid().ToString("N").Substring(0, 10) + "!"
          New-LocalUser -Name mostraother -Password (ConvertTo-SecureString $password -AsPlainText -Force) -PasswordNeverExpires -AccountNeverExpires | Out-Null
          "::add-mask::$password"
          "MOSTRA_TEST_OTHER_USER=mostraother" >> $env:GITHUB_ENV
          "MOSTRA_TEST_OTHER_PASSWORD=$password" >> $env:GITHUB_ENV
      - name: prove-seeds --only RT-10
        run: node packages/runtime/scripts/prove-seeds.ts --only RT-10
