# A disposable probe of the Windows facts WP-W1's design relies on (removed before the package
# merges): the helper's gate, Job Objects, owner-only access control and pipe, checked against
# another local user, and which of the workspace's native modules load on Windows.
name: Windows probe (WP-W1, temporary)

on:
  push:
    branches: ["wp/w1-*"]
    paths:
      - "crates/mostra-win/**"
      - ".github/workflows/windows-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helper:
    name: helper (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: The runner's privileges (whether backup and restore are enabled)
        shell: pwsh
        run: whoami /priv
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Build the helper
        shell: bash
        run: |
          rustup show
          cargo build -p mostra-win --locked
      - name: Another local user
        shell: pwsh
        run: |
          $password = ConvertTo-SecureString 'Xq7!vT9#kL2$' -AsPlainText -Force
          New-LocalUser -Name mostraprobe -Password $password -PasswordNeverExpires -AccountNeverExpires | Format-List
          Get-LocalUser mostraprobe | Format-List
      - name: Probe
        shell: bash
        run: node crates/mostra-win/probe/probe.mjs target/debug mostraprobe 'Xq7!vT9#kL2$'

  natives:
    name: natives (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install
        shell: bash
        run: pnpm install --frozen-lockfile
      - name: Native modules
        shell: bash
        working-directory: packages/runtime
        run: |
          node -e "const D=require('better-sqlite3'); const d=new D(':memory:'); console.log('better-sqlite3', d.prepare('select sqlite_version() v').get())" || echo "better-sqlite3 FAILED"
          node -e "import('oxc-parser').then(m=>console.log('oxc-parser', typeof m.parseSync))" || echo "oxc-parser FAILED"
          node -e "import('vite').then(m=>console.log('vite', m.version))" || echo "vite FAILED"
          node -e "import('lightningcss').then(m=>console.log('lightningcss', typeof m.transform))" || echo "lightningcss FAILED"
          node -e "import('@tailwindcss/oxide').then(m=>console.log('oxide', Object.keys(m).length))" || echo "oxide FAILED"
          ls node_modules/.bin | head -40
      - name: Runtime unit tests (to see what fails)
        shell: bash
        continue-on-error: true
        run: pnpm --filter @mostra/protocol --filter @mostra/runtime... build && pnpm --filter @mostra/runtime exec vitest run --project unit 2>&1 | tail -150
