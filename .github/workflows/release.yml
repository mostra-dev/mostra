# Releases (EN-05, D67, REPO_STANDARDS §9). A release starts when the version pull request
# (`changeset version`, which the accepting session opens, docs/agents/release.md) merges:
#
#   plan        the release's version, and whether this run publishes it
#   build       release-build.yml on GitHub's runners: the bundles built, audited and smoke-tested
#               with no Node.js, every package packed and dry-run published, the npm path
#   publish     in the protected `release` environment, one run at a time, for a version with no
#               changeset pending that isn't released in full: attestations, the GitHub release
#               (published and checked from outside first: the one source of truth for its
#               bundles), then npm trusted publishing (provenance, no token), crates.io when a crate
#               is publishable. `plan` decides between `fresh` and `finish` (a published release npm
#               lacks part of: its tag's source for the packages and its own archives, never a new
#               build); packages/bundle/scripts/github-release.ts
#
# A push to main that publishes nothing runs only the plan: CI's merge-queue run rehearsed the
# release on every platform before the commit reached main (D152), and pull requests rehearse it
# too.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # A run on main may be publishing: never cancel it.
  cancel-in-progress: false

env:
  LEFTHOOK: "0"
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"
  FORCE_COLOR: "0"

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
      mode: ${{ steps.plan.outputs.mode }}
      node: ${{ steps.plan.outputs.node }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # none, fresh (build, release, publish) or finish (the release is published and npm lacks
      # part of it: its own assets and its tag's source, never a new build; Opus review finding 1).
      - name: The version, and what this run does about it
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          node packages/bundle/scripts/github-release.ts state --event "$EVENT" --ref "$REF" > "$RUNNER_TEMP/state"
          cat "$RUNNER_TEMP/state" >> "$GITHUB_OUTPUT"
          echo "node=$(node -p 'require("./packages/bundle/node.json").version')" >> "$GITHUB_OUTPUT"
          {
            echo "### Release plan"
            sed 's/^/    /' "$RUNNER_TEMP/state"
          } >> "$GITHUB_STEP_SUMMARY"

  # The release's bundles build where a published release's always have: on GitHub's runners, one
  # per platform (D142 item 1), never on Blacksmith (npm's trusted publishing and the provenance
  # of what it publishes need GitHub-hosted runners).
  build:
    name: build
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    uses: ./.github/workflows/release-build.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      mode: ${{ needs.plan.outputs.mode }}
      node: ${{ needs.plan.outputs.node }}
      platforms: >-
        [{"platform":"darwin-arm64","runner":"macos-15"},{"platform":"darwin-x64","runner":"macos-15-intel"},{"platform":"linux-x64","runner":"ubuntu-24.04"},{"platform":"linux-arm64","runner":"ubuntu-24.04-arm"},{"platform":"win32-x64","runner":"windows-2025"},{"platform":"win32-arm64","runner":"windows-11-arm"}]
      npm-smoke: >-
        [{"platform":"linux-x64","runner":"ubuntu-24.04"},{"platform":"darwin-arm64","runner":"macos-15"},{"platform":"win32-x64","runner":"windows-2025"},{"platform":"win32-arm64","runner":"windows-11-arm"}]
      linux-runner: ubuntu-24.04

  publish:
    name: publish
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Only main may deploy to this environment (tools/github/settings.ts), and only a version
    # pull request's merge reaches this job.
    environment: release
    # One publishing run at a time, never cancelled: a second waits for the first to finish.
    concurrency:
      group: release-publish
      cancel-in-progress: false
    permissions:
      contents: write # the tag and the GitHub release
      id-token: write # npm trusted publishing, crates.io trusted publishing, attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundle-*
          path: ${{ runner.temp }}/assets
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: ${{ runner.temp }}/release
      - name: Attest the bundles
        if: needs.plan.outputs.mode == 'fresh'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/assets/mostra-*.tar.gz
      # The release first, and checked from outside, then npm (Opus review findings 1 and 2): once
      # published, the release and its assets are immutable, and the @mostra/sdk npm gets pins
      # exactly them, so an install never meets a pin without its archive.
      - name: The GitHub release (published, immutable)
        if: needs.plan.outputs.mode == 'fresh'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          cp "$RUNNER_TEMP/release/assets/SHA256SUMS" "$RUNNER_TEMP/assets/"
          node packages/bundle/scripts/github-release.ts publish --assets "$RUNNER_TEMP/assets" \
            --notes "$RUNNER_TEMP/release/npm/notes.md" --target "$SHA"
      - name: The release holds exactly these bundles, and each downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$RUNNER_TEMP/release/assets/SHA256SUMS" "$RUNNER_TEMP/assets/"
          node packages/bundle/scripts/github-release.ts verify --assets "$RUNNER_TEMP/assets"
      - name: npm (trusted publishing, provenance)
        run: node packages/bundle/scripts/publish-npm.ts publish --from "$RUNNER_TEMP/release/npm"
      # The crates publish from the release's own tag with the release's pins (D143), so a run
      # that finishes a release publishes exactly what the first one would have.
      - name: The crates to publish
        id: crates
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          case "$VERSION" in *[!0-9A-Za-z.+-]* | "") echo "Unexpected version: $VERSION" >&2; exit 1 ;; esac
          git fetch --no-tags --depth 1 origin "+refs/tags/v$VERSION:refs/tags/v$VERSION"
          git checkout --detach "v$VERSION"
          cp "$RUNNER_TEMP/release/npm/crate-pins.json" crates/mostra-host/bundles.json
          node tools/release/crates.ts plan --version "$VERSION" | tee -a "$GITHUB_OUTPUT"
      - name: A crate's first release
        if: steps.crates.outputs.first != ''
        env:
          FIRST: ${{ steps.crates.outputs.first }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          echo "First release of $FIRST: run tools/release/crates-setup.sh $VERSION once (docs/agents/release.md)." >> "$GITHUB_STEP_SUMMARY"
      - name: crates.io (trusted publishing)
        if: steps.crates.outputs.publish != ''
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish the crates
        if: steps.crates.outputs.publish != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          CRATES: ${{ steps.crates.outputs.publish }}
        run: for crate in $CRATES; do cargo publish --locked --allow-dirty -p "$crate"; done
