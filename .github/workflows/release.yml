# Releases (EN-05, D67, REPO_STANDARDS §9). One workflow builds, proves and publishes a Mostra
# release:
#
#   plan        the release's version, and whether this run publishes it
#   bundle      a runtime bundle per platform, built on that platform, its license audit (RT-01)
#   smoke       each bundle on a fresh runner with no Node.js on PATH: checked, tampering refused,
#               set up, new, verify, publish, moved, published again
#   packages    the bundle pins in @mostra/sdk, every npm package packed and checked, and
#               `npm publish --dry-run` of each: the release dry run
#   npm-smoke   the packed packages through npm on an older Node.js: create-mostra, verify, publish
#   npm-old-node  the packed packages on Node.js 20, which they refuse with a diagnostic
#   publish     on main, in the protected `release` environment, one run at a time, for a
#               version with no changeset pending that isn't released in full: attestations, the
#               GitHub release (published and checked from outside first: the one source of truth
#               for its bundles), then npm trusted publishing (provenance, no token), crates.io
#               when a crate is publishable. `plan` decides between `fresh` and `finish` (a
#               published release npm lacks part of: its tag's source for the packages and its own
#               archives, never a new build); packages/bundle/scripts/github-release.ts
#
# A release starts when the version pull request (`changeset version`, which the accepting
# session opens, docs/agents/release.md) merges. Pull requests that touch distribution run
# everything but publish.
name: Release

on:
  push:
    branches: [main]
  # Everything a bundle carries or a release runs, so a change that breaks a bundle goes red on its
  # own pull request, never first on main (Opus review finding 10). Docs alone don't run it.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/actions/setup/**
      - .changeset/config.json
      - .node-version
      - packages/**
      - "!packages/**/*.md"
      - tools/license-audit/**
      - tools/api/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  # A run on main may be publishing: never cancel it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LEFTHOOK: "0"
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"
  FORCE_COLOR: "0"

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
      mode: ${{ steps.plan.outputs.mode }}
      rehearse: ${{ steps.plan.outputs.rehearse }}
      node: ${{ steps.plan.outputs.node }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # none, fresh (build, release, publish) or finish (the release is published and npm lacks
      # part of it: its own assets and its tag's source, never a new build; Opus review finding 1).
      - name: The version, and what this run does about it
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          node packages/bundle/scripts/github-release.ts state --event "$EVENT" --ref "$REF" > "$RUNNER_TEMP/state"
          # With changesets pending, the run rehearses the version they make: npm already has
          # this tree's and refuses even a dry run over it (D143).
          node tools/release/versions.ts plan > "$RUNNER_TEMP/rehearsal"
          if grep -q '^rehearse=true' "$RUNNER_TEMP/rehearsal"; then
            grep -v '^version=' "$RUNNER_TEMP/state" > "$RUNNER_TEMP/state.next"
            mv "$RUNNER_TEMP/state.next" "$RUNNER_TEMP/state"
          fi
          cat "$RUNNER_TEMP/rehearsal" >> "$RUNNER_TEMP/state"
          cat "$RUNNER_TEMP/state" >> "$GITHUB_OUTPUT"
          echo "node=$(node -p 'require("./packages/bundle/node.json").version')" >> "$GITHUB_OUTPUT"
          {
            echo "### Release plan"
            sed 's/^/    /' "$RUNNER_TEMP/state"
          } >> "$GITHUB_STEP_SUMMARY"

  bundle:
    name: bundle (${{ matrix.platform }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: darwin-arm64, runner: macos-15 }
          - { platform: darwin-x64, runner: macos-15-intel }
          - { platform: linux-x64, runner: ubuntu-24.04 }
          - { platform: linux-arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        if: needs.plan.outputs.mode != 'finish'
        with:
          job: bundle
      # Changesets pending: build the version they make (versions.ts, D143).
      - name: Rehearse the next version
        if: needs.plan.outputs.rehearse == 'true'
        run: node tools/release/versions.ts rehearse
      - name: Build the bundle
        if: needs.plan.outputs.mode != 'finish'
        run: node packages/bundle/scripts/build.ts --out "$RUNNER_TEMP/bundle"
      # Finishing a published release: its own archive, checked against its record and the
      # release's digest, never a new build (the published @mostra/sdk pins these bytes).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.plan.outputs.mode == 'finish'
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: The published release's bundle
        if: needs.plan.outputs.mode == 'finish'
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ matrix.platform }}
        run: node packages/bundle/scripts/github-release.ts fetch --platform "$PLATFORM" --out "$RUNNER_TEMP/bundle"
      - name: Audit what it ships
        if: needs.plan.outputs.mode != 'finish'
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: node tools/license-audit/cli.ts --bundle "$RUNNER_TEMP/bundle/stage/mostra-$VERSION-$PLATFORM"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/bundle/mostra-*.tar.gz
            ${{ runner.temp }}/bundle/mostra-*.json
          if-no-files-found: error
          retention-days: 7

  # A fresh runner per platform, with no Node.js set up and none on the PATH the test uses.
  smoke:
    name: smoke (${{ matrix.platform }}, no Node.js)
    needs: [plan, bundle]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: darwin-arm64, runner: macos-15 }
          - { platform: darwin-x64, runner: macos-15-intel }
          - { platform: linux-x64, runner: ubuntu-24.04 }
          - { platform: linux-arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: packages/bundle/scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle-${{ matrix.platform }}
          path: ${{ runner.temp }}/assets
      - name: new, verify and publish with no Node.js
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          record="$RUNNER_TEMP/assets/mostra-$VERSION-$PLATFORM.json"
          sha=$(sed -n 's/.*"sha256": *"\([0-9a-f]*\)".*/\1/p' "$record")
          sh packages/bundle/scripts/smoke.sh "$RUNNER_TEMP/assets/mostra-$VERSION-$PLATFORM.tar.gz" "$sha"

  packages:
    name: packages (pins, pack, npm publish --dry-run)
    needs: [plan, bundle]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Finishing a published release packs from the release's own tag, so every tarball npm still
      # lacks is the one the original run would have published (pnpm's tarballs are reproducible).
      - name: The release's own source (finishing a published release)
        if: needs.plan.outputs.mode == 'finish'
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          case "$VERSION" in *[!0-9A-Za-z.+-]* | "") echo "Unexpected version: $VERSION" >&2; exit 1 ;; esac
          git fetch --no-tags --depth 1 origin "+refs/tags/v$VERSION:refs/tags/v$VERSION"
          git checkout --detach "v$VERSION"
      - uses: ./.github/actions/setup
        with:
          job: release-packages
      - name: Rehearse the next version
        if: needs.plan.outputs.rehearse == 'true'
        run: node tools/release/versions.ts rehearse
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundle-*
          path: ${{ runner.temp }}/assets
          merge-multiple: true
      - name: Build the published packages
        run: pnpm exec turbo run build --filter=./packages/*
      - name: Pin the bundles in @mostra/sdk
        run: node packages/bundle/scripts/pins.ts --assets "$RUNNER_TEMP/assets"
      - name: Pack and check every package
        run: node packages/bundle/scripts/publish-npm.ts pack --out "$RUNNER_TEMP/npm"
      - name: The release dry run
        run: node packages/bundle/scripts/publish-npm.ts publish --from "$RUNNER_TEMP/npm" --dry-run
      - name: Release notes
        run: node packages/bundle/scripts/notes.ts > "$RUNNER_TEMP/npm/notes.md"
      # The crate carries the same pins as @mostra/sdk (D143): its build embeds them. Packaging it
      # here builds it from what crates.io would get, as the npm dry run does for the packages.
      - name: Package the crates with the release's pins
        run: |
          cp packages/sdk/dist/bundles.json crates/mostra-host/bundles.json
          cp packages/sdk/dist/bundles.json "$RUNNER_TEMP/npm/crate-pins.json"
          cargo package --locked --allow-dirty -p mostra-host
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-packages
          path: |
            ${{ runner.temp }}/npm
            ${{ runner.temp }}/assets/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  npm-smoke:
    name: npm-smoke (${{ matrix.platform }}, Node.js 22)
    needs: [plan, packages]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, runner: ubuntu-24.04 }
          - { platform: darwin-arm64, runner: macos-15 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: packages/bundle/scripts
      # An older Node.js line than the bundle's, as many machines have: Mostra runs on its own.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: ${{ runner.temp }}/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle-${{ matrix.platform }}
          path: ${{ runner.temp }}/assets
      - name: create-mostra, verify and publish through npm
        env:
          NODE_VERSION: ${{ needs.plan.outputs.node }}
        run: sh packages/bundle/scripts/npm-smoke.sh "$RUNNER_TEMP/release/npm" "$RUNNER_TEMP/assets" "$NODE_VERSION"

  # A Node.js too old to start Mostra: refused at once with MOSTRA_ENV_NODE_UNSUPPORTED.
  npm-old-node:
    name: npm-old-node (Node.js 20)
    needs: [plan, packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: packages/bundle/scripts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: ${{ runner.temp }}/release
      - name: mostra and create-mostra refuse Node.js 20
        run: sh packages/bundle/scripts/npm-old-node.sh "$RUNNER_TEMP/release/npm"

  publish:
    name: publish
    needs: [plan, bundle, smoke, packages, npm-smoke, npm-old-node]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Only main may deploy to this environment (tools/github/settings.ts), and only a version
    # pull request's merge reaches this job.
    environment: release
    # One publishing run at a time, never cancelled: a second waits for the first to finish.
    concurrency:
      group: release-publish
      cancel-in-progress: false
    permissions:
      contents: write # the tag and the GitHub release
      id-token: write # npm trusted publishing, crates.io trusted publishing, attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundle-*
          path: ${{ runner.temp }}/assets
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: ${{ runner.temp }}/release
      - name: Attest the bundles
        if: needs.plan.outputs.mode == 'fresh'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/assets/mostra-*.tar.gz
      # The release first, and checked from outside, then npm (Opus review findings 1 and 2): once
      # published, the release and its assets are immutable, and the @mostra/sdk npm gets pins
      # exactly them, so an install never meets a pin without its archive.
      - name: The GitHub release (published, immutable)
        if: needs.plan.outputs.mode == 'fresh'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          cp "$RUNNER_TEMP/release/assets/SHA256SUMS" "$RUNNER_TEMP/assets/"
          node packages/bundle/scripts/github-release.ts publish --assets "$RUNNER_TEMP/assets" \
            --notes "$RUNNER_TEMP/release/npm/notes.md" --target "$SHA"
      - name: The release holds exactly these bundles, and each downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$RUNNER_TEMP/release/assets/SHA256SUMS" "$RUNNER_TEMP/assets/"
          node packages/bundle/scripts/github-release.ts verify --assets "$RUNNER_TEMP/assets"
      - name: npm (trusted publishing, provenance)
        run: node packages/bundle/scripts/publish-npm.ts publish --from "$RUNNER_TEMP/release/npm"
      # The crates publish from the release's own tag with the release's pins (D143), so a run
      # that finishes a release publishes exactly what the first one would have.
      - name: The crates to publish
        id: crates
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          case "$VERSION" in *[!0-9A-Za-z.+-]* | "") echo "Unexpected version: $VERSION" >&2; exit 1 ;; esac
          git fetch --no-tags --depth 1 origin "+refs/tags/v$VERSION:refs/tags/v$VERSION"
          git checkout --detach "v$VERSION"
          cp "$RUNNER_TEMP/release/npm/crate-pins.json" crates/mostra-host/bundles.json
          node tools/release/crates.ts plan --version "$VERSION" | tee -a "$GITHUB_OUTPUT"
      - name: A crate's first release
        if: steps.crates.outputs.first != ''
        env:
          FIRST: ${{ steps.crates.outputs.first }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          echo "First release of $FIRST: run tools/release/crates-setup.sh $VERSION once (docs/agents/release.md)." >> "$GITHUB_STEP_SUMMARY"
      - name: crates.io (trusted publishing)
        if: steps.crates.outputs.publish != ''
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish the crates
        if: steps.crates.outputs.publish != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          CRATES: ${{ steps.crates.outputs.publish }}
        run: for crate in $CRATES; do cargo publish --locked --allow-dirty -p "$crate"; done
