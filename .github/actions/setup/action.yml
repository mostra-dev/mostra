name: Set up the workspace
description: Node from .node-version, pnpm from packageManager, a cached store, a frozen install, and the Turborepo cache for this job.
inputs:
  job:
    description: The check job name, used to key the Turborepo cache.
    required: true
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        cache: true
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version
        package-manager-cache: false
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Restore the Turborepo cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ inputs.job }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ inputs.job }}-${{ hashFiles('pnpm-lock.yaml') }}-
          turbo-${{ runner.os }}-${{ inputs.job }}-
